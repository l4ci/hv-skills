# Release build for the hv CLI. Asset names are a contract with install.sh: it
# downloads hv_<os>_<arch> and checks it against checksums.txt. Run
# `goreleaser release --snapshot --clean` to build locally.
version: 2
project_name: hv

builds:
  - id: hv
    main: ./cmd/hv
    binary: hv
    env:
      - CGO_ENABLED=0
    # No windows: the sidecar lock uses flock (as the Go lock code does).
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/l4ci/hv/v5/internal/version.Version={{ .Version }}
      - -X github.com/l4ci/hv/v5/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/l4ci/hv/v5/internal/version.Date={{ .Date }}

archives:
  # Bare binaries for install.sh.
  - id: installer
    formats: [binary]
    name_template: "hv_{{ .Os }}_{{ .Arch }}"
  # Tarballs for people and package managers.
  - id: tarball
    formats: [tar.gz]
    name_template: "hv_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# One GitHub release per version. The release workflow (on a v* tag) makes it
# as a draft carrying the binaries; `hv release publish` then fills in the
# approved notes and publishes it. A draft's assets do not resolve at
# /releases/download/, so install.sh sees nothing until that gated step. Notes come
# from /hv-release, not from commit messages.
release:
  draft: true
  replace_existing_draft: true
changelog:
  disable: true

# Homebrew formula, pushed to the tap on release. The tap repo and the token
# are the maintainer's one-time setup (HOMEBREW_TAP_TOKEN, see .hv/RELEASE.md).
# skip_upload: auto keeps a prerelease tag out of the tap. The formula installs
# from the tarballs above; goreleaser fills in their URLs and sha256 sums.
# Note: the formula is built when the draft is made, so it points at assets
# that only resolve once `hv release publish` publishes the draft; run that
# promptly after the workflow finishes.
brews:
  - name: hv
    ids: [tarball]
    repository:
      owner: l4ci
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/l4ci/hv
    description: Plan, ship and run parallel rounds with AI coding agents
    license: MIT
    skip_upload: auto
    test: |
      assert_match version.to_s, shell_output("#{bin}/hv version")
    caveats: |
      Next: hv skills install
